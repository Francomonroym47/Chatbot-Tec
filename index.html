<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asistente Virtual</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0f;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    #chatContainer {
        width: 420px;
        height: 85vh;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        backdrop-filter: blur(14px);
        position: relative;
    }

    #refreshChat {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(255,255,255,0.15);
        border: none;
        color: white;
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 10px;
        backdrop-filter: blur(8px);
        transition: 0.2s;
        font-size: 18px;
    }

    #refreshChat:hover {
        background: rgba(255,255,255,0.25);
    }

    #chat {
        flex: 1;
        overflow-y: auto;
        padding-right: 10px;
    }

    .msg {
        margin-bottom: 12px;
        padding: 10px 14px;
        border-radius: 12px;
        max-width: 80%;
        line-height: 1.4;
    }

    .user {
        background: rgba(0, 140, 255, 0.3);
        align-self: flex-end;
    }

    .bot {
        background: rgba(255, 255, 255, 0.15);
        align-self: flex-start;
    }

    #inputBox {
        display: flex;
        margin-top: 10px;
    }

    #messageInput {
        flex: 1;
        padding: 10px;
        border-radius: 12px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.1);
        color: white;
    }

    #sendBtn {
        margin-left: 8px;
        padding: 10px 14px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    #sendBtn:hover {
        background: #0a8bff;
    }
</style>
</head>
<body>

<div id="chatContainer">
    <button id="refreshChat">↻</button>
    <div id="chat"></div>

    <div id="inputBox">
        <input id="messageInput" type="text" placeholder="Escribe tu mensaje..." />
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<script>
cconst N8N_WEBHOOK_URL = "https://n8n.srv1161635.hstgr.cloud/webhook/6b4f38ff-0de0-49f0-843f-a277a55bdfd5";
let sessionId = localStorage.getItem("sessionId") || crypto.randomUUID();
localStorage.setItem("sessionId", sessionId);

// Mensaje inicial
window.onload = () => {
    agregarMensajeBot(`
        <b>¡Hola! 👋 Soy tu Asistente Virtual TEC.</b><br>
        Estoy aquí para ayudarte a resolver cualquier problema técnico o académico.<br><br>
        Cuéntame, ¿en qué puedo ayudarte hoy?
    `);
};


// ---------------------------------------------------------
// ENVIO DEL MENSAJE
// ---------------------------------------------------------
async function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    if (!message) return;

    agregarMensajeUsuario(message);
    input.value = "";

    mostrarProcesando(true);

    try {
        // Petición con manejo de CORS
        const response = await fetch(N8N_WEBHOOK_URL, {
            method: "POST",
            mode: "cors", // Añadir esto explícitamente
            headers: {
                "Content-Type": "application/json",
                "Accept": "application/json"
            },
            body: JSON.stringify({
                message,
                sessionId
            })
        });

        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        console.log("Respuesta del servidor:", data);

        // Ajusta según la estructura real de la respuesta
        const respuesta = data.output || data.message || "Sin respuesta";
        agregarMensajeBot(formatearHTMLSeguro(respuesta));

    } catch (error) {
        console.error("Error completo:", error);
        agregarMensajeBot(`
            Error al conectar con el servidor 😕<br>
            <small>Detalles: ${error.message}</small>
        `);
    }

    mostrarProcesando(false);
}

// ---------------------------------------------------------
// MUESTRA EL MENSAJE DEL USUARIO
// ---------------------------------------------------------
function agregarMensajeUsuario(msg) {
    const chat = document.getElementById("chat");
    const burbuja = document.createElement("div");
    burbuja.className = "msg user";
    burbuja.textContent = msg;
    chat.appendChild(burbuja);
    chat.scrollTop = chat.scrollHeight;
}

// ---------------------------------------------------------
// MUESTRA EL MENSAJE DEL BOT (HTML PERMITIDO)
// ---------------------------------------------------------
function agregarMensajeBot(msgHTML) {
    const chat = document.getElementById("chat");
    const burbuja = document.createElement("div");
    burbuja.className = "msg bot";
    burbuja.innerHTML = msgHTML;
    chat.appendChild(burbuja);
    chat.scrollTop = chat.scrollHeight;
}

// ---------------------------------------------------------
// ANIMACIÓN "Procesando..."
// ---------------------------------------------------------
function mostrarProcesando(show) {
    // Añade esto en tu HTML: <div id="loader" style="display:none;">Procesando...</div>
    const loader = document.getElementById("loader");
    if (loader) {
        loader.style.display = show ? "block" : "none";
    }
}

// ---------------------------------------------------------
// FORMATEO SEGURO (limpia HTML y convierte URLs en links)
// ---------------------------------------------------------
function formatearHTMLSeguro(texto) {
    if (!texto) return "";

    // El backend ya manda HTML limpio, pero por seguridad:
    texto = texto
        .replace(/</g, "<")
        .replace(/>/g, ">");

    // Convierte URLs en links clickeables
    texto = texto.replace(
        /(https?:\/\/[^\s<]+)/g,
        url => `<a href="${url}" target="_blank" style="color:#4DA3FF;text-decoration:underline;">${url}</a>`
    );

    return texto;
}

function refrescarChat() {
    const chat = document.getElementById("chat");
    chat.innerHTML = "";
    agregarMensajeBot("<b>¡Chat reiniciado!</b> 🔄<br>¿En qué puedo ayudarte ahora?");
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("messageInput").addEventListener("keypress", e => {
    if (e.key === "Enter") sendMessage();
});
    
</script>
</body>
</html>
