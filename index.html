<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA TEC CSF</title>
<style>
    /* CONTENEDOR PRINCIPAL */
    body {
        background: #0d0f12;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .chat-container {
        width: 100%;
        max-width: 600px;
        height: 70vh;
        margin: 0 auto;

        /* GLASS EFFECT */
        background: rgba(20, 20, 20, 0.45);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);

        display: flex;
        flex-direction: column;
        color: white;
    }

    /* HEADER */
    .chat-header {
        background: rgba(30, 30, 30, 0.55);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        color: #e5e5e5;
        padding: 15px;
        text-align: center;
        border-radius: 16px 16px 0 0;
    }

    /* MENSAJES */
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
        background: #18171c;
        height: calc(80vh - 120px); /* Más alto */
        max-height: 80vh;
    }

    .message {
        margin: 10px 0;
        padding: 12px;
        border-radius: 12px;
        max-width: 80%;
        word-wrap: break-word;
        animation: fadein 0.3s ease;
    }

    /* MENSAJE DEL USUARIO */
    .user-message {
        background: rgba(0, 122, 255, 0.4);
        color: #18171c;
        backdrop-filter: blur(5px);
        margin-left: auto;
        text-align: right;
        border: 1px solid rgba(0,122,255,0.3);
    }

    /* MENSAJE DEL ASISTENTE */
    .assistant-message {
        background: rgba(255,255,255,0.08);
        color: #18171c;
        border: 1px solid rgba(255,255,255,0.1);
        backdrop-filter: blur(5px);
    }

    /* INPUT DEL CHAT */
    .chat-input-container {
        display: flex;
        padding: 15px;
        background: rgba(20, 20, 20, 0.6);
        border-top: 1px solid rgba(255,255,255,0.08);
        border-radius: 0 0 16px 16px;
    }

    .chat-input {
        flex: 1;
        padding: 12px;
        background: rgba(255,255,255,0.09);
        color: white;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 8px;
        margin-right: 10px;
        font-size: 14px;
        outline: none;
    }

    .chat-input::placeholder {
        color: rgba(255,255,255,0.5);
    }

    /* BOTÓN */
    .send-button {
        padding: 12px 20px;
        background: rgba(0,122,255,0.7);
        border: 1px solid rgba(0,122,255,0.3);
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }

    .send-button:hover {
        background: rgba(0,122,255,0.9);
    }

    .send-button:disabled {
        background: rgba(120,120,120,0.4);
        cursor: not-allowed;
    }

    /* INDICADOR "ESCRIBIENDO" */
    .typing-indicator {
        padding: 10px;
        color: rgba(200,200,200,0.8);
        font-style: italic;
        font-size: 13px;
    }

    /* TIMESTAMP */
    .timestamp {
        font-size: 11px;
        opacity: 0.6;
        margin-top: 5px;
        text-align: right;
    }

    /* PERMITIR FORMATO */
    .content {
        white-space: pre-wrap;
    }

    @keyframes fadein {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* BOTÓN LIMPIAR */
    button {
        font-family: inherit;
    }
</style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h3>🤖 Asistente Virtual</h3>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-container">
            <input type="text" id="userInput" class="chat-input" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button id="sendButton" class="send-button" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

<script>
/* CONFIG */
const N8N_WEBHOOK_URL = 'https://n8n.srv1161635.hstgr.cloud/webhook/6b4f38ff-0de0-49f0-843f-a277a55bdfd5';

/* MEMORIA */
const sessionId = localStorage.getItem("chatSession") || crypto.randomUUID();
localStorage.setItem("chatSession", sessionId);

let isWaitingForResponse = false;

/* INICIO */
document.addEventListener('DOMContentLoaded', function() {
    loadChatHistory();
    document.getElementById('userInput').focus();

    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !isWaitingForResponse) {
            sendMessage();
        }
    });
});

/* HISTORIAL */
function loadChatHistory() {
    const saved = localStorage.getItem(`chatHistory_${sessionId}`);
    const messagesDiv = document.getElementById('chatMessages');

    if (saved) {
        messagesDiv.innerHTML = saved;
    } else {
        addMessage("¡Hola! Soy tu agente de asistencia. ¿En qué puedo ayudarte hoy?", false, true);
    }

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function saveChatHistory() {
    const messagesDiv = document.getElementById('chatMessages');
    localStorage.setItem(`chatHistory_${sessionId}`, messagesDiv.innerHTML);
}

/* FUNCIONES NUEVAS PARA PERMITIR HTML SEGURO */
function sanitizeHTML(html) {
    const temp = document.createElement("div");
    temp.innerHTML = html;
    return temp.innerHTML;
}

/* AGREGAR MENSAJE */
function addMessage(content, isUser = false, isInitial = false) {
    const messagesDiv = document.getElementById('chatMessages');

    if (isInitial) messagesDiv.innerHTML = "";

    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;

    const timestamp = new Date().toLocaleTimeString();

    messageDiv.innerHTML = `
        <div class="content">${content}</div>
        <div class="timestamp">${timestamp}</div>
    `;

    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    saveChatHistory();
}

/* INDICADOR */
function showTypingIndicator() {
    const div = document.createElement("div");
    div.id = "typingIndicator";
    div.className = "typing-indicator";
    div.textContent = "El asistente está escribiendo...";
    document.getElementById('chatMessages').appendChild(div);
}

function hideTypingIndicator() {
    const d = document.getElementById('typingIndicator');
    if (d) d.remove();
    saveChatHistory();
}

/* ENVÍO DEL MENSAJE */
async function sendMessage() {
    if (isWaitingForResponse) return;

    const input = document.getElementById('userInput');
    const button = document.getElementById('sendButton');
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, true);
    input.value = "";
    input.disabled = true;
    button.disabled = true;

    isWaitingForResponse = true;
    showTypingIndicator();

    try {
        const response = await fetch(N8N_WEBHOOK_URL, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message,
                sessionId
            })
        });

        if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);

        const data = await response.json();
        console.log("Respuesta completa:", data);

        const msg = data?.[0]?.output || "No recibí respuesta 😕";

        hideTypingIndicator();
        addMessage(formatRichContent(msg), false);

    } catch (error) {
        console.error(error);
        hideTypingIndicator();
        addMessage("❌ Error de conexión. Inténtalo más tarde.", false);
    } finally {
        input.disabled = false;
        button.disabled = false;
        input.focus();
        isWaitingForResponse = false;
    }
}

/* REINICIAR CONVERSACIÓN */
function addClearButton() {
    const clearBtn = document.createElement("button");
    clearBtn.textContent = "🔄 Nueva Conversación";
    clearBtn.style.cssText = "position: absolute; top: 10px; right: 10px; padding: 5px 10px;";
    clearBtn.onclick = function () {
        localStorage.removeItem(`chatHistory_${sessionId}`);
        const newId = crypto.randomUUID();
        localStorage.setItem("chatSession", newId);
        location.reload();
    };
    document.body.appendChild(clearBtn);
}

addClearButton();
</script>
</body>
</html>
