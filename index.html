<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat IA TEC CSF</title>
<style>
    /* CONTENEDOR PRINCIPAL */
    body {
        background: #0d0f12;
        margin: 0;
        padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .chat-container {
        width: 100%;
        max-width: 650px;
        height: 78vh;
        margin: 0 auto;

        /* GLASS EFFECT */
        background: rgba(20, 20, 20, 0.45);
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);

        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 16px;
        box-shadow: 0 8px 30px rgba(0,0,0,0.5);

        display: flex;
        flex-direction: column;
        color: white;
    }

    /* HEADER */
    .chat-header {
        background: rgba(30, 30, 30, 0.55);
        backdrop-filter: blur(10px);
        border-bottom: 1px solid rgba(255,255,255,0.08);
        color: #e5e5e5;
        padding: 15px;
        text-align: center;
        border-radius: 16px 16px 0 0;
    }

    /* MENSAJES */
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 18px;
        background: #18171c;
        height: calc(78vh - 140px);
        max-height: 78vh;
        scroll-behavior: smooth;
    }

    .message {
        margin: 10px 0;
        padding: 12px;
        border-radius: 12px;
        max-width: 86%;
        word-wrap: break-word;
        animation: fadein 0.3s ease;
    }

    .user-message {
        background: rgba(0, 122, 255, 0.4);
        color: #fff;
        margin-left: auto;
        text-align: right;
        border: 1px solid rgba(0,122,255,0.3);
    }

    .assistant-message {
        background: rgba(255,255,255,0.08);
        color: #e6e6e6;
        border: 1px solid rgba(255,255,255,0.1);
    }

    /* INPUT */
    .chat-input-container {
        display: flex;
        padding: 15px;
        background: rgba(20, 20, 20, 0.6);
        border-top: 1px solid rgba(255,255,255,0.08);
        border-radius: 0 0 16px 16px;
    }

    .chat-input {
        flex: 1;
        padding: 12px;
        background: rgba(255,255,255,0.09);
        color: white;
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 8px;
        margin-right: 10px;
        font-size: 14px;
        outline: none;
    }

    .send-button {
        padding: 12px 20px;
        background: rgba(0,122,255,0.7);
        border: 1px solid rgba(0,122,255,0.3);
        color: white;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }

    .send-button:hover {
        background: rgba(0,122,255,0.9);
    }

    .send-button:disabled {
        background: rgba(120,120,120,0.4);
        cursor: not-allowed;
    }

    .typing-indicator {
        padding: 10px;
        color: rgba(200,200,200,0.8);
        font-style: italic;
        font-size: 13px;
    }

    .timestamp {
        font-size: 11px;
        opacity: 0.6;
        margin-top: 5px;
        text-align: right;
    }

    .content {
        white-space: pre-wrap;
    }

    @keyframes fadein {
        from { opacity: 0; transform: translateY(5px); }
        to { opacity: 1; transform: translateY(0); }
    }
</style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h3>🤖 Asistente Virtual</h3>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-container">
            <input type="text" id="userInput" class="chat-input" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button id="sendButton" class="send-button" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

<script>
/* WEBHOOK */
const N8N_WEBHOOK_URL = "https://n8n.srv1161635.hstgr.cloud/webhook/6b4f38ff-0de0-49f0-843f-a277a55bdfd5";

/* SESIÓN */
const sessionId = localStorage.getItem("chatSession") || crypto.randomUUID();
localStorage.setItem("chatSession", sessionId);

let isWaitingForResponse = false;

/* CARGA */
document.addEventListener("DOMContentLoaded", () => {
    loadChatHistory();
    document.getElementById("userInput").focus();

    document.getElementById("userInput").addEventListener("keypress", e => {
        if (e.key === "Enter" && !isWaitingForResponse) sendMessage();
    });
});

/* HISTORIAL */
function loadChatHistory() {
    const saved = localStorage.getItem(`chatHistory_${sessionId}`);
    const box = document.getElementById("chatMessages");

    if (saved) box.innerHTML = saved;
    else addMessage("¡Hola! Soy tu agente virtual especializado en resolver tus dudas. ¿En qué puedo ayudarte hoy?", false, true);

    box.scrollTop = box.scrollHeight;
}

function saveChatHistory() {
    const box = document.getElementById("chatMessages");
    localStorage.setItem(`chatHistory_${sessionId}`, box.innerHTML);
}

/* NORMALIZACIÓN AVANZADA */
function formatRichContent(text) {
    if (!text) return "";

    let formatted = text;

    formatted = formatted.replace(/^### (.*$)/gim, "<h3>$1</h3>");
    formatted = formatted.replace(/^## (.*$)/gim, "<h2>$1</h2>");
    formatted = formatted.replace(/^# (.*$)/gim, "<h1>$1</h1>");

    formatted = formatted.replace(/\*\*(.*?)\*\*/gim, "<strong>$1</strong>");
    formatted = formatted.replace(/\*(.*?)\*/gim, "<em>$1</em>");

    formatted = formatted.replace(/^- (.*)$/gim, "<li>$1</li>");
    formatted = formatted.replace(/(<li>.*<\/li>)/gims, "<ul>$1</ul>");

    formatted = formatted.replace(/(https?:\/\/[^\s]+)/gim, '<a href="$1" target="_blank" style="color:#4da3ff">$1</a>');

    formatted = formatted.replace(/\n/g, "<br>");

    return formatted.trim();
}

/* AGREGAR MENSAJE */
function addMessage(content, isUser = false, isInitial = false) {
    const box = document.getElementById("chatMessages");

    if (isInitial) box.innerHTML = "";

    const msg = document.createElement("div");
    msg.className = `message ${isUser ? "user-message" : "assistant-message"}`;

    const timestamp = new Date().toLocaleTimeString();

    msg.innerHTML = `
        <div class="content">${content}</div>
        <div class="timestamp">${timestamp}</div>
    `;

    box.appendChild(msg);
    box.scrollTop = box.scrollHeight;
    saveChatHistory();
}

/* TYPING */
function showTypingIndicator() {
    const box = document.getElementById("chatMessages");
    const div = document.createElement("div");
    div.id = "typingIndicator";
    div.className = "typing-indicator";
    div.textContent = "El asistente está escribiendo...";
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
}

function hideTypingIndicator() {
    const el = document.getElementById("typingIndicator");
    if (el) el.remove();
    saveChatHistory();
}

/* SEND MESSAGE */
async function sendMessage() {
    if (isWaitingForResponse) return;

    const input = document.getElementById("userInput");
    const button = document.getElementById("sendButton");
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, true);
    input.value = "";
    input.disabled = true;
    button.disabled = true;

    isWaitingForResponse = true;
    showTypingIndicator();

    try {
        const response = await fetch(N8N_WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message, sessionId })
        });

        if (!response.ok) throw new Error("HTTP " + response.status);

        const data = await response.json();
        const msg = data?.[0]?.output || "No recibí respuesta 😕";

        hideTypingIndicator();
        addMessage(formatRichContent(msg), false);

    } catch (e) {
        hideTypingIndicator();
        addMessage("❌ Error de conexión. Inténtalo más tarde.", false);
    } finally {
        input.disabled = false;
        button.disabled = false;
        input.focus();
        isWaitingForResponse = false;
    }
}

/* BOTÓN RESET */
(function(){
    const btn = document.createElement("button");
    btn.textContent = "🔄 Nueva conversación";
    btn.style.cssText = "position:absolute;top:10px;right:10px;padding:6px 12px;font-size:12px;";
    btn.onclick = () => {
        localStorage.removeItem(`chatHistory_${sessionId}`);
        localStorage.setItem("chatSession", crypto.randomUUID());
        location.reload();
    };
    document.body.appendChild(btn);
})();
</script>
</body>
</html>
