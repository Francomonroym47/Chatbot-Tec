<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Asistente Virtual</title>
<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0d0d0f;
        color: #fff;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    #chatContainer {
        width: 420px;
        height: 85vh;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        backdrop-filter: blur(14px);
        position: relative;
    }

    #refreshChat {
        position: absolute;
        top: 10px;
        right: 10px;
        background: rgba(255,255,255,0.15);
        border: none;
        color: white;
        padding: 6px 10px;
        cursor: pointer;
        border-radius: 10px;
        backdrop-filter: blur(8px);
        transition: 0.2s;
        font-size: 18px;
    }

    #refreshChat:hover {
        background: rgba(255,255,255,0.25);
    }

    #chat {
        flex: 1;
        overflow-y: auto;
        padding-right: 10px;
    }

    .msg {
        margin-bottom: 12px;
        padding: 10px 14px;
        border-radius: 12px;
        max-width: 80%;
        line-height: 1.4;
    }

    .user {
        background: rgba(0, 140, 255, 0.3);
        align-self: flex-end;
    }

    .bot {
        background: rgba(255, 255, 255, 0.15);
        align-self: flex-start;
    }

    #inputBox {
        display: flex;
        margin-top: 10px;
    }

    #messageInput {
        flex: 1;
        padding: 10px;
        border-radius: 12px;
        border: none;
        outline: none;
        background: rgba(255,255,255,0.1);
        color: white;
    }

    #sendBtn {
        margin-left: 8px;
        padding: 10px 14px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: 0.2s;
    }

    #sendBtn:hover {
        background: #0a8bff;
    }
</style>
</head>
<body>

<div id="chatContainer">
    <button id="refreshChat">↻</button>
    <div id="chat"></div>

    <div id="inputBox">
        <input id="messageInput" type="text" placeholder="Escribe tu mensaje..." />
        <button id="sendBtn">Enviar</button>
    </div>
</div>

<script>
const N8N_WEBHOOK_URL = "https://n8n.srv1161635.hstgr.cloud/webhook/6b4f38ff-0de0-49f0-843f-a277a55bdfd5";
let sessionId = localStorage.getItem("sessionId") || crypto.randomUUID();
localStorage.setItem("sessionId", sessionId);

function agregarMensajeBot(texto) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "msg bot";
    div.innerHTML = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function agregarMensajeUsuario(texto) {
    const chat = document.getElementById("chat");
    const div = document.createElement("div");
    div.className = "msg user";
    div.textContent = texto;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

async function enviarMensaje() {
    const input = document.getElementById("messageInput");
    const msg = input.value.trim();
    if (!msg) return;

    agregarMensajeUsuario(msg);
    input.value = "";

    try {
        const response = await fetch(N8N_WEBHOOK_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: msg, sessionId })
        });

        const data = await response.json();
        agregarMensajeBot(data.output || "⚠️ No recibí respuesta válida");

    } catch (e) {
        agregarMensajeBot("⚠️ Error al conectar con el servidor");
    }
}

document.getElementById("sendBtn").addEventListener("click", enviarMensaje);
document.getElementById("messageInput").addEventListener("keypress", e => {
    if (e.key === "Enter") enviarMensaje();
});
function refrescarChat() {
    const chat = document.getElementById("chat");
    chat.innerHTML = "";
    agregarMensajeBot("<b>¡Chat reiniciado!</b> 🔄<br>¿En qué puedo ayudarte ahora?");
}
document.getElementById("refreshChat").addEventListener("click", refrescarChat);
agregarMensajeBot("¡Hola! Soy tu asistente virtual especializado 🤖<br>¿En qué puedo ayudarte hoy?");
</script>
</body>
</html>
