<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat con Agente</title>
    <style>
        /* Estilos */
        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 70vh;
            margin: 0 auto;
            border: 1px solid #0078d4;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: white;
        }
        .chat-header {
            background: #0078d4;
            color: white;
            padding: 15px;
            text-align: center;
            border-radius: 8px 8px 0 0;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
        }
        .message {
            margin: 10px 0;
            padding: 12px;
            border-radius: 8px;
            max-width: 80%;
            word-wrap: break-word;
        }
        .user-message {
            background: #0078d4;
            color: white;
            margin-left: auto;
            text-align: right;
        }
        .assistant-message {
            background: #e1e1e1;
            color: #323130;
        }
        .chat-input-container {
            display: flex;
            padding: 15px;
            border-top: 1px solid #e1e1e1;
            background: white;
            border-radius: 0 0 8px 8px;
        }
        .chat-input {
            flex: 1;
            padding: 12px;
            border: 1px solid #e1e1e1;
            border-radius: 4px;
            margin-right: 10px;
            font-size: 14px;
        }
        .send-button {
            padding: 12px 20px;
            background: #0078d4;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        .send-button:disabled {
            background: #a0a0a0;
            cursor: not-allowed;
        }
        .typing-indicator {
            padding: 10px;
            color: #666;
            font-style: italic;
        }
        .timestamp {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
        }

        /* ESTILO NUEVO PARA PERMITIR SALTOS Y FORMATO */
        .content {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h3>🤖 Asistente Virtual</h3>
        </div>
        <div id="chatMessages" class="chat-messages"></div>
        <div class="chat-input-container">
            <input type="text" id="userInput" class="chat-input" placeholder="Escribe tu mensaje..." autocomplete="off">
            <button id="sendButton" class="send-button" onclick="sendMessage()">Enviar</button>
        </div>
    </div>

<script>
/* CONFIG */
const N8N_WEBHOOK_URL = 'https://n8n.srv1161635.hstgr.cloud/webhook/6b4f38ff-0de0-49f0-843f-a277a55bdfd5';

/* MEMORIA */
const sessionId = localStorage.getItem("chatSession") || crypto.randomUUID();
localStorage.setItem("chatSession", sessionId);

let isWaitingForResponse = false;

/* INICIO */
document.addEventListener('DOMContentLoaded', function() {
    loadChatHistory();
    document.getElementById('userInput').focus();

    document.getElementById('userInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !isWaitingForResponse) {
            sendMessage();
        }
    });
});

/* HISTORIAL */
function loadChatHistory() {
    const saved = localStorage.getItem(`chatHistory_${sessionId}`);
    const messagesDiv = document.getElementById('chatMessages');

    if (saved) {
        messagesDiv.innerHTML = saved;
    } else {
        addMessage("¡Hola! Soy tu agente de asistencia. ¿En qué puedo ayudarte hoy?", false, true);
    }

    messagesDiv.scrollTop = messagesDiv.scrollHeight;
}

function saveChatHistory() {
    const messagesDiv = document.getElementById('chatMessages');
    localStorage.setItem(`chatHistory_${sessionId}`, messagesDiv.innerHTML);
}

/* FUNCIONES NUEVAS PARA PERMITIR HTML SEGURO */
function sanitizeHTML(html) {
    const temp = document.createElement("div");
    temp.innerHTML = html;
    return temp.innerHTML;
}

/* AGREGAR MENSAJE */
function addMessage(content, isUser = false, isInitial = false) {
    const messagesDiv = document.getElementById('chatMessages');

    if (isInitial) messagesDiv.innerHTML = "";

    const messageDiv = document.createElement('div');
    messageDiv.className = `message ${isUser ? 'user-message' : 'assistant-message'}`;

    const timestamp = new Date().toLocaleTimeString();

    messageDiv.innerHTML = `
        <div class="content">${content}</div>
        <div class="timestamp">${timestamp}</div>
    `;

    messagesDiv.appendChild(messageDiv);
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
    saveChatHistory();
}

/* INDICADOR */
function showTypingIndicator() {
    const div = document.createElement("div");
    div.id = "typingIndicator";
    div.className = "typing-indicator";
    div.textContent = "El asistente está escribiendo...";
    document.getElementById('chatMessages').appendChild(div);
}

function hideTypingIndicator() {
    const d = document.getElementById('typingIndicator');
    if (d) d.remove();
    saveChatHistory();
}

/* ENVÍO DEL MENSAJE */
async function sendMessage() {
    if (isWaitingForResponse) return;

    const input = document.getElementById('userInput');
    const button = document.getElementById('sendButton');
    const message = input.value.trim();
    if (!message) return;

    addMessage(message, true);
    input.value = "";
    input.disabled = true;
    button.disabled = true;

    isWaitingForResponse = true;
    showTypingIndicator();

    try {
        const response = await fetch(N8N_WEBHOOK_URL, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
                message,
                sessionId
            })
        });

        if (!response.ok) throw new Error(`Error HTTP: ${response.status}`);

        const data = await response.json();
        console.log("Respuesta completa:", data);

        const msg = data?.[0]?.output || "No recibí respuesta 😕";

        hideTypingIndicator();
        addMessage(sanitizeHTML(msg), false);

    } catch (error) {
        console.error(error);
        hideTypingIndicator();
        addMessage("❌ Error de conexión. Inténtalo más tarde.", false);
    } finally {
        input.disabled = false;
        button.disabled = false;
        input.focus();
        isWaitingForResponse = false;
    }
}

/* REINICIAR CONVERSACIÓN */
function addClearButton() {
    const clearBtn = document.createElement("button");
    clearBtn.textContent = "🔄 Nueva Conversación";
    clearBtn.style.cssText = "position: absolute; top: 10px; right: 10px; padding: 5px 10px;";
    clearBtn.onclick = function () {
        localStorage.removeItem(`chatHistory_${sessionId}`);
        const newId = crypto.randomUUID();
        localStorage.setItem("chatSession", newId);
        location.reload();
    };
    document.body.appendChild(clearBtn);
}

addClearButton();
</script>
</body>
</html>
